hatchery:
  kind: software
  publisher: Hatchery
  product: Software Example
  version: "1.0.0"
  architecture: multi
platforms:
  windows:
    pre_install: []
    install:
      command: 'powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1'
      success_exit_codes: [0]
      reboot_after: false
    post_install: []
    uninstall:
      command: 'msiexec.exe /x {3624F187-6C0A-4D29-BF3C-207C0981DE15} /qn /norestart'
      success_exit_codes: [0, 1605]
    detect:
      command: >-
        powershell -NoProfile -Command
        "$p='{3624F187-6C0A-4D29-BF3C-207C0981DE15}';
        $paths=@(
          \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\$p\",
          \"HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\$p\"
        );
        if ($paths | Where-Object { Test-Path $_ }) { exit 0 } else { exit 1 }"
